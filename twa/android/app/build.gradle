plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.papazz'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.papazz"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "../../papazz-release-key.keystore")
            storePassword System.getenv("KEYSTORE_STORE_PASSWORD") ?: "papazz123"
            keyAlias System.getenv("KEYSTORE_KEY_ALIAS") ?: "papazz"
            keyPassword System.getenv("KEYSTORE_KEY_PASSWORD") ?: "papazz123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
