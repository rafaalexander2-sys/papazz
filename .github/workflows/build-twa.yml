name: Build TWA (Android AAB)

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (non-interactive)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

      - name: Generate keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa/papazz-release-key.keystore
            echo "using_existing=true" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair \
              -v \
              -keystore twa/papazz-release-key.keystore \
              -alias papazz \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass papazz123 \
              -keypass papazz123 \
              -dname "CN=Papazz, OU=Dev, O=Papazz, L=Brasil, ST=Brasil, C=BR"
            echo "using_existing=false" >> $GITHUB_OUTPUT
          fi

      - name: Print SHA-256 fingerprint
        run: |
          echo "=== SHA-256 para o assetlinks.json ==="
          keytool -list -v \
            -keystore twa/papazz-release-key.keystore \
            -alias papazz \
            -storepass papazz123 \
            | grep "SHA256:"

      - name: Build AAB with Bubblewrap
        run: |
          cd twa
          printf "papazz123\npapazz123\n" | bubblewrap build --skipPwaValidation

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: papazz-release
          path: |
            twa/app-release-bundle.aab
            twa/*.aab
          retention-days: 30

      - name: Save keystore as artifact
        if: steps.keystore.outputs.using_existing != 'true'
        run: |
          base64 twa/papazz-release-key.keystore > twa/keystore-base64.txt
          echo "=== IMPORTANTE: Salve este keystore! ==="
          echo "Adicione o conteudo de keystore-base64.txt como secret KEYSTORE_BASE64 no GitHub"

      - name: Upload keystore artifact
        if: steps.keystore.outputs.using_existing != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: papazz-keystore
          path: twa/keystore-base64.txt
          retention-days: 7
