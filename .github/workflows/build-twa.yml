name: Build TWA (Android AAB)

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/android/**'
      - '.github/workflows/build-twa.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "${ANDROID_HOME}/cmdline-tools/" 2>/dev/null && echo "cmdline-tools found" || echo "cmdline-tools NOT found"
          find "${ANDROID_HOME}" -name "sdkmanager" 2>/dev/null | head -5 || echo "sdkmanager not found"

      - name: Accept SDK licenses and install components
        run: |
          SDKMAN=$(find "${ANDROID_HOME}" -name "sdkmanager" 2>/dev/null | head -1)
          echo "Using sdkmanager at: $SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate app icons
        run: |
          for dir_size in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${dir_size%%:*}"
            size="${dir_size##*:}"
            mkdir -p "twa/android/app/src/main/res/$dir"
            convert public/icon-app.png -resize "${size}x${size}" "twa/android/app/src/main/res/$dir/ic_launcher.png"
            cp "twa/android/app/src/main/res/$dir/ic_launcher.png" "twa/android/app/src/main/res/$dir/ic_launcher_round.png"
          done

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore twa/papazz-release-key.keystore \
            -alias papazz \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass papazz123 -keypass papazz123 \
            -dname "CN=Papazz, OU=Dev, O=Papazz, L=Brasil, ST=Brasil, C=BR"

      - name: Print SHA-256 fingerprint
        run: |
          echo "=== SHA-256 para o assetlinks.json ==="
          keytool -list -v \
            -keystore twa/papazz-release-key.keystore \
            -alias papazz -storepass papazz123 \
            | grep "SHA256:"

      - name: Build AAB
        run: gradle -p twa/android bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/twa/papazz-release-key.keystore
          KEYSTORE_STORE_PASSWORD: papazz123
          KEYSTORE_KEY_ALIAS: papazz
          KEYSTORE_KEY_PASSWORD: papazz123

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: papazz-release
          path: twa/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Save and upload keystore
        run: base64 twa/papazz-release-key.keystore > twa/keystore-base64.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: papazz-keystore
          path: twa/keystore-base64.txt
          retention-days: 7
