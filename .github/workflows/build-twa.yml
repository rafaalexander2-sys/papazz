name: Build TWA (Android AAB)

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/android/**'
      - '.github/workflows/build-twa.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Accept SDK licenses and install components
        run: |
          set -x
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate app icons
        run: |
          set -x
          for dir_size in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${dir_size%%:*}"
            size="${dir_size##*:}"
            mkdir -p "twa/android/app/src/main/res/$dir"
            convert public/icon-app.png -resize "${size}x${size}" "twa/android/app/src/main/res/$dir/ic_launcher.png"
            cp "twa/android/app/src/main/res/$dir/ic_launcher.png" "twa/android/app/src/main/res/$dir/ic_launcher_round.png"
          done

      - name: Restore or generate keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restaurando keystore do secret..."
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > twa/papazz-release-key.keystore
            if [ ! -s twa/papazz-release-key.keystore ]; then
              echo "ERRO: keystore vazio apos decode. O secret KEYSTORE_BASE64 esta corrompido."
              exit 1
            fi
          else
            echo "Secret nao encontrado, gerando novo keystore..."
            keytool -genkeypair -v \
              -keystore twa/papazz-release-key.keystore \
              -alias papazz \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass papazz123 -keypass papazz123 \
              -dname "CN=Papazz, OU=Dev, O=Papazz, L=Brasil, ST=Brasil, C=BR"
          fi

      - name: Verify keystore fingerprint
        run: |
          EXPECTED_SHA1="E9:24:54:1B:71:08:2B:D8:E6:42:BE:6A:EE:09:E8:04:B0:5E:4C:E7"
          echo "=== Fingerprints do keystore ==="
          keytool -list -v -keystore twa/papazz-release-key.keystore -alias papazz -storepass papazz123 | grep -E "SHA1:|SHA256:"
          ACTUAL_SHA1=$(keytool -list -v -keystore twa/papazz-release-key.keystore -alias papazz -storepass papazz123 | grep "SHA1:" | sed 's/.*SHA1: //' | tr -d ' \r\n')
          EXPECTED_CLEAN=$(echo "$EXPECTED_SHA1" | tr -d ' \r\n')
          if [ "$ACTUAL_SHA1" = "$EXPECTED_CLEAN" ]; then
            echo "OK: SHA1 bate com o esperado pelo Play Console. Upload vai funcionar."
          else
            echo "ERRO: SHA1 NAO bate com o esperado pelo Play Console."
            echo "Esperado: $EXPECTED_CLEAN"
            echo "Atual:    $ACTUAL_SHA1"
            echo "O secret KEYSTORE_BASE64 nao corresponde ao keystore do primeiro upload."
            exit 1
          fi

      - name: Build AAB
        run: |
          set -x
          echo "sdk.dir=$ANDROID_HOME" > twa/android/local.properties
          gradle -p twa/android :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee twa/gradle-output.txt; exit ${PIPESTATUS[0]}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/twa/papazz-release-key.keystore
          KEYSTORE_STORE_PASSWORD: papazz123
          KEYSTORE_KEY_ALIAS: papazz
          KEYSTORE_KEY_PASSWORD: papazz123

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: twa/gradle-output.txt
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: papazz-release
          path: twa/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Save and upload keystore
        run: base64 twa/papazz-release-key.keystore > twa/keystore-base64.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: papazz-keystore
          path: twa/keystore-base64.txt
          retention-days: 7
