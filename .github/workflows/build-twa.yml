name: Build TWA (Android AAB)

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore (if not cached)
        id: keystore
        run: |
          cd twa
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > papazz-release-key.keystore
            echo "using_existing=true" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair \
              -v \
              -keystore papazz-release-key.keystore \
              -alias papazz \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass papazz123 \
              -keypass papazz123 \
              -dname "CN=Papazz, OU=Dev, O=Papazz, L=Brasil, ST=Brasil, C=BR"
            echo "using_existing=false" >> $GITHUB_OUTPUT
          fi

      - name: Print SHA-256 fingerprint
        run: |
          cd twa
          echo "=== SHA-256 para o assetlinks.json ==="
          keytool -list -v \
            -keystore papazz-release-key.keystore \
            -alias papazz \
            -storepass papazz123 \
            | grep "SHA256:"

      - name: Init Bubblewrap project
        run: |
          cd twa
          bubblewrap init \
            --manifest https://app.papazz.com.br/manifest.json \
            --directory . \
            || true

      - name: Build AAB
        run: |
          cd twa
          echo "papazz123" | bubblewrap build \
            --skipPwaValidation \
            || bubblewrap build --skipPwaValidation
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: papazz-release
          path: |
            twa/app-release-bundle.aab
            twa/*.aab
          retention-days: 30

      - name: Save keystore as artifact
        if: steps.keystore.outputs.using_existing != 'true'
        run: |
          cd twa
          base64 papazz-release-key.keystore > keystore-base64.txt
          echo ""
          echo "=== IMPORTANTE: Salve este keystore! ==="
          echo "Adicione o conteudo de keystore-base64.txt como secret KEYSTORE_BASE64 no GitHub"

      - name: Upload keystore artifact
        if: steps.keystore.outputs.using_existing != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: papazz-keystore
          path: twa/keystore-base64.txt
          retention-days: 7
